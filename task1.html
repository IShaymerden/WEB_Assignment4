    <main class="container">
      <section class="form-card">
        <h1>Task 1: HTML5 Validation</h1>
        <p class="subtitle">
          HTML5 checks required fields, email format, and text length before
          submission.
        </p>
        <form id="form1">
          <div class="mb-3">
            <label for="name1" class="form-label">Name</label
            ><input
              class="form-control"
              id="name1"
              name="name1"
              type="text"
              required
              maxlength="40"
              minlength="2"
              placeholder="Enter your name"
            />
          </div>
          <div class="mb-3">
            <label for="email1" class="form-label">Email</label
            ><input
              class="form-control"
              id="email1"
              name="email1"
              type="email"
              required
              maxlength="100"
              placeholder="name@example.com"
            />
          </div>
          <div class="mb-3">
            <label for="message1" class="form-label">Message</label
            ><textarea
              class="form-control"
              id="message1"
              name="message"
              rows="4"
              required
              minlength="10"
              maxlength="500"
              placeholder="At least 10 characters"
            ></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Submit</button>
          <div class="result"></div>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
