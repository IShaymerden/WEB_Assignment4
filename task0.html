    <main class="container">
      <section class="form-card">
        <h1>Task 0: Simple Contact Form</h1>
        <p class="subtitle">
          Basic HTML inputs, textarea, labels, and submit button.
        </p>
        <form
          action="#"
          method="get"
          onsubmit="
            event.preventDefault();
            document.getElementById('rawResult').textContent =
              'Form submitted (demo only).';
          "
        >
          <label for="name0">Name</label><br /><input
            id="name0"
            name="name"
            type="text"
          /><br /><br /><label for="email0">Email</label><br /><input
            id="email0"
            name="email"
            type="email"
          /><br /><br /><label for="message0">Message</label><br /><textarea
            id="message0"
            name="message"
            rows="4"
            cols="32"
          ></textarea
          ><br /><br /><button type="submit">Submit</button>
          <p id="rawResult"></p>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
