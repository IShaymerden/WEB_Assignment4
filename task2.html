    <main class="container">
      <section class="form-card">
        <h1>Task 2: Bootstrap Form Styling</h1>
        <p class="subtitle">
          Bootstrap form-control, form-label, grid, placeholders, and helper
          text.
        </p>
        <form id="form2">
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="name2" class="form-label">Name</label
                ><input
                  class="form-control"
                  id="name2"
                  name="name2"
                  type="text"
                  required
                  placeholder="Your name"
                />
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="email2" class="form-label">Email</label
                ><input
                  class="form-control"
                  id="email2"
                  name="email2"
                  type="email"
                  required
                  placeholder="name@example.com"
                />
                <div class="form-text">We will never share your email.</div>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label for="message2" class="form-label">Message</label
            ><textarea
              class="form-control"
              id="message2"
              name="message"
              rows="4"
              required
              placeholder="Write your message"
            ></textarea>
            <div class="form-text">Please describe your question.</div>
          </div>
          <button class="btn btn-primary" type="submit">Send message</button>
          <div class="result"></div>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
